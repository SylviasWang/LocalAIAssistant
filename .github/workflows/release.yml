name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish
      run: dotnet publish LocalAIAssistant_App/LocalAIAssistant_App.csproj --configuration Release --output publish

    - name: Zip
      run: Compress-Archive -Path publish/* -DestinationPath LocalAIAssistant.zip

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: LocalAIAssistant.zip
